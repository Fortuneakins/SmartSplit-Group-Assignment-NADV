version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartsplit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartsplit
      POSTGRES_PASSWORD: smartsplit
      POSTGRES_DB: smartsplit
    ports:
      - "5432:5432"
    volumes:
      - smartsplit_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsplit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartsplit_pgdata:
